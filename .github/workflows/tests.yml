# Intégration continue — suite Playwright (audit 2026-09-07, C64).
# Dépôt public : les minutes GitHub Actions sont gratuites et illimitées (BIBLE règle 1, gratuité).
# Ne touche PAS l'application : `app/` reste sans dépendance et la branche `gh-pages` n'est pas concernée.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # relance à la main depuis l'onglet Actions

# Le jeton GITHUB_TOKEN n'a besoin que de LIRE le dépôt. Le réglage du dépôt est déjà en lecture seule
# (vérifié le 2026-09-15 : `gh api repos/alemoine4/carnet-eps/actions/permissions/workflow`) ; ce bloc garde
# la lecture seule même si ce réglage change un jour, alors que la branche de production (gh-pages) vit dans
# ce même dépôt (audit indépendant 2026-09-16, SEC-04 — défense en profondeur).
permissions:
  contents: read

# Une seule exécution à la fois par branche : un push qui suit annule le précédent.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions épinglées par SHA de commit : un tag `v4` peut être déplacé, un commit non (SEC-04). Les SHA retenus
      # sont ceux que `v4` désignait le 2026-09-15 : le code exécuté ne change pas. Version lisible en commentaire.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` (et pas `npm install`) : versions exactes du package-lock.json (C20).
      - run: npm ci

      # Le navigateur de test, à la révision épinglée par la version de Playwright installée.
      - run: npx playwright install --with-deps chromium

      # Le serveur de dev (server-carnet.mjs, port 8160) est lancé par playwright.config.mjs.
      - run: npx playwright test

      # Rapport HTML et traces des tests rouges (C22) : téléchargeables depuis l'exécution.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
